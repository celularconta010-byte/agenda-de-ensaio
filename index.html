<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Ensaio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      color: #1f2937;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    .safe-area-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    @keyframes slideIn {
      from {
        transform: translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .animate-card {
      animation: slideIn 0.3s ease-out forwards;
    }

    .notification-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      border: 2px solid white;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useMemo, useEffect } from 'https://esm.sh/react@19';
    import ReactDOM from 'https://esm.sh/react-dom@19/client';
    import * as Lucide from 'https://esm.sh/lucide-react';
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const {
      Music, MapPin, Settings, ChevronRight, Plus, ArrowLeft,
      Trash2, Bell, Navigation, Info, Save, Lock, LogIn,
      Pencil, CalendarClock, AlertCircle, CloudCheck, CloudOff, Loader2, Repeat, ExternalLink, CalendarDays, ChevronLeft, RefreshCw, CheckCircle2
    } = Lucide;

    // --- Configuração Supabase ---
    const SUPABASE_URL = 'https://slngnwkgddzuymiyhrwm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_o8cP_CS3Iu9V2cnUdjkPzA_X-zG-gK-';

    let supabase = null;
    let isCloudActive = false;

    try {
      if (SUPABASE_URL && !SUPABASE_URL.includes('SUA_URL')) {
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        isCloudActive = true;
      }
    } catch (e) {
      console.error("Erro ao inicializar Supabase:", e);
    }

    // --- Configurações Auxiliares ---
    const DAYS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
    const RECURRENCE_MONTHS = { 'unico': 0, 'bimestral': 2, 'trimestral': 3, 'quadrimestral': 4 };
    const INITIAL_CHURCHES = [
      { id: 'alagoinhas', name: 'Alagoinhas' },
      { id: 'aracas', name: 'Araças' },
      { id: 'aramari', name: 'Aramari' },
      { id: 'teodoro', name: 'Teodoro Sampaio' },
      { id: 'ouricangas', name: 'Ouriçangas' },
    ];

    // --- Funções de Lógica de Data Padrão ---
    const getPatternOfDate = (dateStr) => {
      const d = new Date(dateStr + 'T00:00:00');
      const weekday = d.getDay();
      const date = d.getDate();
      const nth = Math.ceil(date / 7);
      return { nth, weekday };
    };

    const getDateFromPattern = (year, month, nth, weekday) => {
      let d = new Date(year, month, 1);
      let count = 0;
      while (d.getMonth() === month) {
        if (d.getDay() === weekday) {
          count++;
          if (count === nth) return d;
        }
        d.setDate(d.getDate() + 1);
      }
      d.setDate(d.getDate() - 1);
      while (d.getDay() !== weekday) d.setDate(d.getDate() - 1);
      return d;
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState('ensaios');
      const [rehearsals, setRehearsals] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedRehearsal, setSelectedRehearsal] = useState(null);
      const [browsingCity, setBrowsingCity] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [password, setPassword] = useState('');
      const [isAdding, setIsAdding] = useState(false);
      const [editingId, setEditingId] = useState(null);

      const [form, setForm] = useState({
        church: '', city: 'Alagoinhas', date: '', time: '',
        recurrence: 'unico', locationUrl: '', status: 'normal',
        originalDateStr: '', patternNth: 1, patternWeekday: 0
      });

      const fetchData = async () => {
        if (!isCloudActive) {
          const saved = localStorage.getItem('agenda_ensaios_data');
          setRehearsals(saved ? JSON.parse(saved) : []);
          setLoading(false);
          return;
        }

        const { data, error } = await supabase
          .from('ensaios')
          .select('*')
          .order('rawDate', { ascending: true });

        if (error) console.error("Erro ao buscar dados:", error);
        else setRehearsals(data || []);
        setLoading(false);
      };

      useEffect(() => {
        fetchData();

        if (isCloudActive) {
          const subscription = supabase
            .channel('public:ensaios')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'ensaios' }, fetchData)
            .subscribe();

          return () => { supabase.removeChannel(subscription); };
        }
      }, []);

      const handleSave = async (e) => {
        e.preventDefault();
        if (!form.church || !form.date || !form.time) return;
        const pattern = getPatternOfDate(form.date);
        const dateObj = new Date(form.date + 'T00:00:00');
        const data = {
          dayOfWeek: DAYS[dateObj.getDay()],
          date: form.date.split('-').reverse().join('/').substring(0, 5),
          time: form.time,
          churchName: form.church,
          city: form.city,
          recurrence: form.recurrence,
          locationUrl: form.locationUrl,
          rawDate: form.date,
          status: form.status,
          originalDateStr: form.status === 'remarcado' ? form.originalDateStr : '',
          patternNth: form.status === 'normal' ? pattern.nth : form.patternNth,
          patternWeekday: form.status === 'normal' ? pattern.weekday : form.patternWeekday
        };

        if (isCloudActive) {
          if (editingId) {
            await supabase.from('ensaios').update(data).eq('id', editingId);
          } else {
            await supabase.from('ensaios').insert([data]);
          }
          fetchData(); // Atualizar localmente após salvar
        } else {
          const updated = editingId
            ? rehearsals.map(r => r.id === editingId ? { ...data, id: editingId } : r)
            : [{ ...data, id: Date.now().toString() }, ...rehearsals];
          setRehearsals(updated);
          localStorage.setItem('agenda_ensaios_data', JSON.stringify(updated));
        }
        setIsAdding(false); setEditingId(null);
      };

      const handleAdvanceRehearsal = async (r) => {
        const monthsToAdd = RECURRENCE_MONTHS[r.recurrence] || 1;
        const currentDate = new Date(r.rawDate + 'T00:00:00');
        const nextMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + monthsToAdd, 1);

        const nextDate = getDateFromPattern(nextMonth.getFullYear(), nextMonth.getMonth(), r.patternNth, r.patternWeekday);
        const isoDate = nextDate.toISOString().split('T')[0];

        const nextData = {
          ...r,
          status: 'normal',
          originalDateStr: '',
          rawDate: isoDate,
          date: isoDate.split('-').reverse().join('/').substring(0, 5),
          dayOfWeek: DAYS[nextDate.getDay()]
        };
        delete nextData.id;

        if (isCloudActive) {
          await supabase.from('ensaios').update(nextData).eq('id', r.id);
        } else {
          const updated = rehearsals.map(item => item.id === r.id ? { ...nextData, id: r.id } : item);
          setRehearsals(updated);
          localStorage.setItem('agenda_ensaios_data', JSON.stringify(updated));
        }
        alert("Ensaio avançado! O status voltou ao normal conforme o dia padrão.");
      };

      const upcomingRehearsals = useMemo(() => {
        const now = new Date(); now.setHours(0, 0, 0, 0);
        const limit = new Date(); limit.setDate(now.getDate() + 15);
        return rehearsals.filter(r => {
          const rd = new Date(r.rawDate + 'T00:00:00');
          return rd >= now && rd <= limit;
        });
      }, [rehearsals]);

      const cityRehearsals = useMemo(() => {
        if (!browsingCity) return [];
        const now = new Date(); now.setHours(0, 0, 0, 0);
        return rehearsals.filter(r => r.city === browsingCity && new Date(r.rawDate + 'T00:00:00') >= now);
      }, [rehearsals, browsingCity]);

      const hasRehearsalToday = useMemo(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        return rehearsals.some(r => r.rawDate === todayStr);
      }, [rehearsals]);

      const getPatternLabel = (nth, weekday) => `${nth}º ${DAYS[weekday]}`;

      return (
        <div className="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col relative pb-20 shadow-2xl border-x border-gray-200">
          <header className="bg-white/90 backdrop-blur-md border-b border-gray-200 sticky top-0 z-50 px-4 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              {selectedRehearsal ? <button onClick={() => setSelectedRehearsal(null)} className="text-blue-600"><ArrowLeft size={20} /></button> : activeTab === 'igrejas' && browsingCity ? <button onClick={() => setBrowsingCity(null)} className="text-blue-600"><ChevronLeft size={20} /></button> : null}
              <Music size={24} className="text-blue-600" />
              <h1 className="text-xl font-bold text-gray-800">{selectedRehearsal ? 'Detalhes' : activeTab === 'ensaios' ? 'Agenda' : browsingCity || 'Cidades'}</h1>
            </div>
            <div className="flex items-center gap-4">
              {isCloudActive ? <CloudCheck size={18} className="text-green-600" title="Conectado ao Supabase" /> : <CloudOff size={18} className="text-gray-400" title="Usando LocalStorage" />}
              <div className="relative">
                <Bell size={20} className={hasRehearsalToday ? "text-blue-600" : "text-gray-400"} />
                {hasRehearsalToday && <span className="notification-dot"></span>}
              </div>
            </div>
          </header>

          <main className="flex-1 p-4 overflow-y-auto bg-gray-100/30">
            {selectedRehearsal ? (
              <div className="animate-card bg-white rounded-3xl p-6 border border-gray-200 shadow-sm">
                <div className="flex gap-2 mb-4">
                  <span className="text-[10px] font-bold text-blue-600 uppercase bg-blue-50 px-2 py-1 rounded-full border border-blue-100 flex items-center gap-1">
                    <Repeat size={10} /> {getPatternLabel(selectedRehearsal.patternNth, selectedRehearsal.patternWeekday)}
                  </span>
                  {selectedRehearsal.status === 'remarcado' && (
                    <span className="text-[10px] font-bold text-orange-600 uppercase bg-orange-50 px-2 py-1 rounded-full border border-orange-100 flex items-center gap-1">
                      <AlertCircle size={10} /> REMARCADO
                    </span>
                  )}
                </div>
                <h2 className="text-3xl font-black text-gray-900 leading-tight">{selectedRehearsal.churchName}</h2>
                <p className="text-gray-500 mb-6 font-medium flex items-center gap-1"><MapPin size={14} /> {selectedRehearsal.city}</p>

                <div className="grid grid-cols-3 gap-2 text-center bg-gray-50 p-4 rounded-2xl mb-6 border border-gray-200">
                  <div><p className="text-[10px] text-gray-400 font-bold uppercase mb-1">Data</p><p className="font-bold text-gray-800">{selectedRehearsal.date}</p></div>
                  <div className="border-x border-gray-200"><p className="text-[10px] text-gray-400 font-bold uppercase mb-1">Hora</p><p className="font-bold text-gray-800">{selectedRehearsal.time}</p></div>
                  <div><p className="text-[10px] text-gray-400 font-bold uppercase mb-1">Dia</p><p className="font-bold text-gray-800">{selectedRehearsal.dayOfWeek}</p></div>
                </div>

                {selectedRehearsal.status === 'remarcado' && selectedRehearsal.originalDateStr && (
                  <div className="mb-6 p-4 bg-orange-50/50 rounded-2xl border border-orange-100 flex items-start gap-3">
                    <CalendarClock size={20} className="text-orange-500 shrink-0 mt-0.5" />
                    <div>
                      <p className="text-xs font-bold text-orange-800 uppercase mb-0.5">Remarcado</p>
                      <p className="text-xs text-orange-700 font-medium italic">Data original: <span className="line-through">{selectedRehearsal.originalDateStr}</span></p>
                    </div>
                  </div>
                )}

                <button onClick={() => window.open(selectedRehearsal.locationUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selectedRehearsal.churchName + ' ' + selectedRehearsal.city)}`, '_blank')} className="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 mb-4 shadow-lg active:scale-95 transition-all"><Navigation size={20} /> VER NO MAPA</button>
                <div className="bg-gray-50 p-5 rounded-2xl border border-gray-200">
                  <h4 className="text-blue-600 font-bold text-[10px] uppercase mb-2 flex items-center gap-1"><Info size={14} /> Versículo</h4>
                  <p className="text-gray-700 text-sm italic">"Louvai ao Senhor, porque ele é bom. Salmos 106:1"</p>
                </div>
              </div>
            ) : (
              <>
                {activeTab === 'ensaios' && (
                  <div className="animate-card space-y-4">
                    <h2 className="text-gray-500 font-bold uppercase text-xs tracking-wider">Próximos 15 dias</h2>
                    {upcomingRehearsals.map(r => (
                      <div key={r.id} onClick={() => setSelectedRehearsal(r)} className="bg-white p-5 rounded-3xl border border-gray-200 flex items-center justify-between shadow-sm cursor-pointer hover:bg-gray-50 transition-all active:scale-[0.98]">
                        <div>
                          <div className="flex items-center gap-2">
                            <p className="font-bold text-gray-900">{r.dayOfWeek}, {r.date}</p>
                            {r.status === 'remarcado' && <span className="text-[8px] bg-orange-100 text-orange-600 px-1 rounded border border-orange-200 font-black uppercase">Remarcado</span>}
                          </div>
                          <p className="text-sm font-semibold text-gray-600 mt-0.5">{r.churchName} ({r.city})</p>
                        </div>
                        <div className="text-gray-600 font-semibold text-sm">{r.time}</div>
                      </div>
                    ))}
                    {upcomingRehearsals.length === 0 && <div className="text-center py-20 text-gray-400">Nenhum ensaio nos próximos 15 dias.</div>}
                  </div>
                )}

                {activeTab === 'igrejas' && (
                  <div className="animate-card">
                    {!browsingCity ? (
                      <div className="space-y-4">
                        <label className="text-[10px] font-bold text-gray-400 uppercase ml-2 mb-1 block">Escolha uma Cidade</label>
                        <div className="relative">
                          <select
                            onChange={(e) => setBrowsingCity(e.target.value)}
                            className="w-full bg-white p-5 rounded-3xl border border-gray-200 shadow-sm appearance-none outline-none font-bold text-gray-800 pr-12 cursor-pointer focus:border-blue-200"
                            defaultValue=""
                          >
                            <option value="" disabled>Selecione a cidade...</option>
                            {INITIAL_CHURCHES.map(city => (
                              <option key={city.id} value={city.name}>{city.name}</option>
                            ))}
                          </select>
                          <div className="absolute right-6 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
                            <ChevronRight size={20} className="rotate-90" />
                          </div>
                        </div>

                        <div className="text-center py-16 opacity-40">
                          <MapPin size={48} className="mx-auto text-gray-300 mb-2" />
                          <p className="text-gray-500 text-sm">Selecione uma cidade no dropdown<br />para ver os ensaios locais.</p>
                        </div>
                      </div>
                    ) : (
                      <div className="space-y-4">
                        <div className="flex items-center justify-between px-2 mb-2">
                          <h3 className="text-xs font-bold text-gray-400 uppercase">Ensaios em {browsingCity}</h3>
                          <button onClick={() => setBrowsingCity(null)} className="text-[10px] font-bold text-blue-600 uppercase bg-blue-50 px-2 py-1 rounded-full">Trocar Cidade</button>
                        </div>
                        {cityRehearsals.map(r => (
                          <div key={r.id} onClick={() => setSelectedRehearsal(r)} className="bg-white p-5 rounded-3xl border border-gray-200 flex items-center justify-between shadow-sm cursor-pointer hover:bg-gray-50 transition-colors">
                            <div className="flex flex-col">
                              <div className="flex items-center gap-2">
                                <p className="font-bold text-gray-900">{r.dayOfWeek}, {r.date}</p>
                                {r.status === 'remarcado' && <span className="text-[8px] bg-orange-100 text-orange-600 px-1 rounded border border-orange-200 uppercase font-black">Remarcado</span>}
                              </div>
                              <p className="text-sm font-semibold text-gray-600 mt-0.5">{r.churchName} ({r.city})</p>
                            </div>
                            <div className="text-gray-600 font-semibold text-sm">{r.time}</div>
                          </div>
                        ))}
                        {cityRehearsals.length === 0 && (
                          <div className="text-center py-20 text-gray-400 text-sm italic">Nenhum ensaio futuro agendado para esta cidade.</div>
                        )}
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'admin' && (
                  <div className="animate-card">
                    {!isAdmin ? (
                      <div className="bg-white p-10 rounded-3xl text-center shadow-xl mt-8 border border-gray-200">
                        <Lock size={32} className="mx-auto text-gray-300 mb-6" />
                        <form onSubmit={e => { e.preventDefault(); if (password === 'ensaiosccbst1') setIsAdmin(true); else alert('Senha incorreta!'); }} className="space-y-4">
                          <input type="password" placeholder="Senha" className="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl text-center outline-none" value={password} onChange={e => setPassword(e.target.value)} />
                          <button className="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg"><LogIn size={20} /> ENTRAR</button>
                        </form>
                      </div>
                    ) : (
                      <div className="pb-8">
                        {isAdding ? (
                          <form onSubmit={handleSave} className="bg-white p-6 rounded-3xl space-y-4 border border-gray-200 shadow-xl">
                            <h3 className="text-center font-bold text-blue-600 uppercase text-xs">Dados do Ensaio</h3>

                            <div className="space-y-1">
                              <label className="text-[10px] font-bold text-gray-400 uppercase ml-2">Nome da Igreja</label>
                              <input placeholder="Ex: Central" className="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:border-blue-300" value={form.church} onChange={e => setForm({ ...form, church: e.target.value })} />
                            </div>

                            <div className="space-y-1">
                              <label className="text-[10px] font-bold text-gray-400 uppercase ml-2">Cidade</label>
                              <select className="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none" value={form.city} onChange={e => setForm({ ...form, city: e.target.value })}>{INITIAL_CHURCHES.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}</select>
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                              <div className="space-y-1">
                                <label className="text-[10px] font-bold text-gray-400 uppercase ml-2">Data</label>
                                <input type="date" className="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} />
                              </div>
                              <div className="space-y-1">
                                <label className="text-[10px] font-bold text-gray-400 uppercase ml-2">Hora</label>
                                <input type="time" className="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none" value={form.time} onChange={e => setForm({ ...form, time: e.target.value })} />
                              </div>
                            </div>

                            <div className="space-y-1">
                              <label className="text-[10px] font-bold text-gray-400 uppercase ml-2">Recorrência</label>
                              <select className="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none" value={form.recurrence} onChange={e => setForm({ ...form, recurrence: e.target.value })}>
                                <option value="unico">Único</option>
                                <option value="bimestral">Bimestral (2 em 2 meses)</option>
                                <option value="trimestral">Trimestral (3 em 3 meses)</option>
                                <option value="quadrimestral">Quadrimestral (4 em 4 meses)</option>
                              </select>
                            </div>

                            <div className="space-y-2 pt-2">
                              <label className="text-[10px] font-bold text-gray-400 uppercase ml-2">Status do Ensaio</label>
                              <div className="flex gap-2">
                                <button
                                  type="button"
                                  onClick={() => setForm({ ...form, status: 'normal' })}
                                  className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl font-bold text-xs border transition-all ${form.status === 'normal' ? 'bg-green-50 border-green-200 text-green-700 shadow-sm' : 'bg-gray-50 border-gray-200 text-gray-400 opacity-60'}`}
                                >
                                  <CheckCircle2 size={16} /> NORMAL
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setForm({ ...form, status: 'remarcado' })}
                                  className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl font-bold text-xs border transition-all ${form.status === 'remarcado' ? 'bg-orange-50 border-orange-200 text-orange-700 shadow-sm' : 'bg-gray-50 border-gray-200 text-gray-400 opacity-60'}`}
                                >
                                  <AlertCircle size={16} /> REMARCADO
                                </button>
                              </div>

                              {form.status === 'remarcado' && (
                                <div className="p-4 bg-orange-50 border border-orange-100 rounded-2xl mt-2 animate-card">
                                  <div className="flex items-center gap-2 mb-2 text-orange-700">
                                    <CalendarClock size={16} />
                                    <label className="text-[10px] font-bold uppercase">Data Original para Aviso</label>
                                  </div>
                                  <input
                                    placeholder="Ex: 15/05 (Aparecerá riscado)"
                                    className="w-full p-3 bg-white border border-orange-200 rounded-xl outline-none text-orange-700 placeholder:text-orange-300 font-bold text-sm shadow-inner"
                                    value={form.originalDateStr}
                                    onChange={e => setForm({ ...form, originalDateStr: e.target.value })}
                                  />
                                  <p className="text-[9px] text-orange-600 mt-2 italic font-medium">Os irmãos verão que este ensaio foi alterado desta data original.</p>
                                </div>
                              )}
                            </div>

                            <div className="space-y-1">
                              <label className="text-[10px] font-bold text-blue-600 uppercase ml-2 flex items-center gap-1"><MapPin size={10} /> Localização (Endereço ou Link Maps)</label>
                              <input placeholder="Digite o endereço ou cole o link do Google Maps" className="w-full p-4 bg-blue-50/50 border border-blue-100 rounded-2xl outline-none text-blue-700 text-sm" value={form.locationUrl} onChange={e => setForm({ ...form, locationUrl: e.target.value })} />
                            </div>

                            <div className="flex gap-3 pt-4"><button type="button" onClick={() => setIsAdding(false)} className="flex-1 bg-gray-100 py-4 rounded-2xl font-bold text-gray-500">CANCELAR</button><button type="submit" className="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg">SALVAR</button></div>
                          </form>
                        ) : (
                          <div className="space-y-4">
                            <button onClick={() => { setEditingId(null); setIsAdding(true); setForm({ church: '', city: 'Alagoinhas', date: '', time: '', recurrence: 'unico', status: 'normal', originalDateStr: '', locationUrl: '' }); }} className="w-full bg-blue-600 text-white font-bold p-5 rounded-2xl flex items-center justify-center gap-2 mb-6 shadow-xl"><Plus size={24} /> NOVO ENSAIO</button>
                            {rehearsals.map(r => (
                              <div key={r.id} className="bg-white p-5 rounded-3xl flex items-center justify-between border border-gray-200 shadow-sm transition-all hover:shadow-md">
                                <div className="truncate pr-4">
                                  <div className="flex items-center gap-1.5">
                                    <p className="text-lg font-black text-gray-800 leading-tight">{r.churchName}</p>
                                    {r.status === 'remarcado' && <AlertCircle size={14} className="text-orange-500 shrink-0" />}
                                  </div>
                                  <p className="text-[10px] text-gray-400 font-bold uppercase mt-0.5">{r.date} • {r.city}</p>
                                </div>
                                <div className="flex gap-1 shrink-0">
                                  <button title="Avançar Mês (Reset Status)" onClick={() => handleAdvanceRehearsal(r)} className="text-green-600 p-2 hover:bg-green-50 rounded-lg"><RefreshCw size={18} /></button>
                                  <button onClick={() => { setEditingId(r.id); setIsAdding(true); setForm({ ...r, church: r.churchName, date: r.rawDate }); }} className="text-blue-600 p-2 hover:bg-blue-50 rounded-lg"><Pencil size={18} /></button>
                                  <button onClick={async () => { if (confirm('Excluir ensaio?')) { if (isCloudActive) { await supabase.from('ensaios').delete().eq('id', r.id); } else { setRehearsals(rehearsals.filter(x => x.id !== r.id)); } } }} className="text-red-500 p-2 hover:bg-red-50 rounded-lg"><Trash2 size={18} /></button>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}
              </>
            )}
          </main>

          {!selectedRehearsal && (
            <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-lg border-t border-gray-200 flex justify-around items-center py-3 safe-area-bottom z-50">
              <button onClick={() => { setActiveTab('ensaios'); setBrowsingCity(null); }} className={`flex flex-col items-center gap-1.5 py-1 px-5 rounded-2xl ${activeTab === 'ensaios' ? 'text-blue-600 bg-blue-50 border border-blue-100' : 'text-gray-400'}`}><Music size={22} /><span className="text-[10px] font-bold uppercase">Ensaios</span></button>
              <button onClick={() => setActiveTab('igrejas')} className={`flex flex-col items-center gap-1.5 py-1 px-5 rounded-2xl ${activeTab === 'igrejas' ? 'text-blue-600 bg-blue-50 border border-blue-100' : 'text-gray-400'}`}><MapPin size={22} /><span className="text-[10px] font-bold uppercase">Cidades</span></button>
              <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center gap-1.5 py-1 px-5 rounded-2xl ${activeTab === 'admin' ? 'text-blue-600 bg-blue-50 border border-blue-100' : 'text-gray-400'}`}><Settings size={22} /><span className="text-[10px] font-bold uppercase">Painel</span></button>
            </nav>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
