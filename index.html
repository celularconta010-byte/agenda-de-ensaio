<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useMemo, useEffect } from 'https://esm.sh/react@19';
    import ReactDOM from 'https://esm.sh/react-dom@19/client';
    import * as Lucide from 'https://esm.sh/lucide-react';
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import { App as CapApp } from 'https://esm.sh/@capacitor/app';
    import { StatusBar, Style } from 'https://esm.sh/@capacitor/status-bar';
    import { LocalNotifications } from 'https://esm.sh/@capacitor/local-notifications';

    const {
      Music, MapPin, Settings, ChevronRight, ChevronDown, Plus, ArrowLeft,
      Trash2, Bell, Navigation, Info, Save, Lock, LogIn,
      Pencil, CalendarClock, AlertCircle, CloudCheck, CloudOff, Loader2, Repeat, ExternalLink, CalendarDays, ChevronLeft, RefreshCw, CheckCircle2, XCircle, Share2
    } = Lucide;

    // --- Configuração Supabase ---
    const SUPABASE_URL = 'https://slngnwkgddzuymiyhrwm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_o8cP_CS3Iu9V2cnUdjkPzA_X-zG-gK-';

    let supabase = null;
    let isCloudActive = false;

    try {
      if (SUPABASE_URL && !SUPABASE_URL.includes('SUA_URL')) {
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        isCloudActive = true;
      }
    } catch (e) {
      console.error("Erro ao inicializar Supabase:", e);
    }

    // --- Configurações Auxiliares ---
    const DAYS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
    const RECURRENCE_MONTHS = { 'unico': 0, 'mensal': 1, 'bimestral': 2, 'trimestral': 3, 'quadrimestral': 4 };
    const INITIAL_CHURCHES = [
      { id: 'alagoinhas', name: 'Alagoinhas' },
      { id: 'aracas', name: 'Araças' },
      { id: 'aramari', name: 'Aramari' },
      { id: 'teodoro', name: 'Teodoro Sampaio' },
      { id: 'ouricangas', name: 'Ouriçangas' },
    ];

    const BIBLE_VERSES = [
      { text: "Louvai ao Senhor, porque ele é bom. Salmos 106:1" },
      { text: "Tudo o que tem fôlego louve ao Senhor. Salmos 150:6" },
      { text: "Cantai ao Senhor um cântico novo, cantai ao Senhor todos os moradores da terra. Salmos 96:1" },
      { text: "O Senhor é o meu pastor; nada me faltará. Salmos 23:1" },
      { text: "Elevo os meus olhos para os montes; de onde me virá o socorro? Salmos 121:1" },
      { text: "Pois o Senhor dá a sabedoria; da sua boca procedem o conhecimento e o entendimento. Provérbios 2:6" },
      { text: "Alegrei-me quando me disseram: Vamos à casa do Senhor. Salmos 122:1" },
      { text: "O coração alegre aformoseia o rosto. Provérbios 15:13" },
      { text: "A tua palavra é lâmpada que ilumina os meus passos e luz que clareia o meu caminho. Salmos 119:105" },
      { text: "Deem graças ao Senhor, porque ele é bom; o seu amor dura para sempre. Salmos 136:1" }
    ];

    // --- Funções de Lógica de Data Padrão ---
    const toLocalISOString = (date) => {
      const offset = date.getTimezoneOffset();
      const localDate = new Date(date.getTime() - (offset * 60 * 1000));
      return localDate.toISOString().split('T')[0];
    };

    const getPatternOfDate = (dateStr) => {
      const d = new Date(dateStr + 'T00:00:00');
      const weekday = d.getDay();
      const date = d.getDate();
      const nth = Math.ceil(date / 7);
      return { nth, weekday };
    };

    const getDateFromPattern = (year, month, nth, weekday) => {
      // Se nth = -1, buscar o ÚLTIMO daquele dia da semana no mês
      if (nth === -1) {
        let d = new Date(year, month + 1, 0); // Último dia do mês
        while (d.getDay() !== weekday) {
          d.setDate(d.getDate() - 1);
        }
        return d;
      }

      // Lógica para posições fixas (1º, 2º, 3º, 4º, 5º)
      let d = new Date(year, month, 1);
      let count = 0;
      while (d.getMonth() === month) {
        if (d.getDay() === weekday) {
          count++;
          if (count === nth) return d;
        }
        d.setDate(d.getDate() + 1);
      }

      // Fallback: se não encontrar (ex: pedir 5º mas só tem 4), pegar o último
      d.setDate(d.getDate() - 1);
      while (d.getDay() !== weekday) d.setDate(d.getDate() - 1);
      return d;
    };

    const getNextValidMonth = (currentYear, currentMonth, monthsToAdd, referenceMonth) => {
      if (monthsToAdd <= 0) return { year: currentYear, month: currentMonth };
      let diff = (currentMonth - (referenceMonth || 0)) % monthsToAdd;
      if (diff < 0) diff += monthsToAdd;
      let monthsToNext = (monthsToAdd - diff) % monthsToAdd;

      let targetMonth = currentMonth + monthsToNext;
      let targetYear = currentYear;
      if (targetMonth > 11) {
        targetYear += Math.floor(targetMonth / 12);
        targetMonth = targetMonth % 12;
      }
      return { year: targetYear, month: targetMonth };
    };

    const checkAndAdvanceRehearsals = async (items) => {
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const todayISO = toLocalISOString(now);
      let hasUpdates = false;

      const updatedItems = items.map(item => {
        if (!item.recurrence || item.recurrence === 'unico') return item;

        let rDate = new Date(item.rawDate + 'T00:00:00');
        if (rDate >= now) return item;

        // Item vencido, calcular próxima data futura
        let nextDate = rDate;
        const monthsToAdd = RECURRENCE_MONTHS[item.recurrence] || 0;
        if (monthsToAdd === 0) return item;

        // Garantir padrão de recorrência
        const nth = item.patternNth !== undefined ? item.patternNth : getPatternOfDate(item.rawDate).nth;
        const weekday = item.patternWeekday !== undefined ? item.patternWeekday : getPatternOfDate(item.rawDate).weekday;

        // Loop até encontrar data futura
        while (nextDate < now) {
          const currentMonth = nextDate.getMonth();
          const currentYear = nextDate.getFullYear();
          const next = getNextValidMonth(currentYear, currentMonth + 1, monthsToAdd, item.referenceMonth);
          nextDate = getDateFromPattern(next.year, next.month, nth, weekday);
          if (nextDate.getFullYear() > now.getFullYear() + 5) break;
        }

        hasUpdates = true;
        const isoDate = toLocalISOString(nextDate);
        return {
          ...item,
          status: 'normal',
          originalDateStr: '',
          suspendedReason: '',
          overrideDate: null,
          rawDate: isoDate,
          date: isoDate.split('-').reverse().join('/').substring(0, 5),
          dayOfWeek: DAYS[nextDate.getDay()],
          patternNth: nth,
          patternWeekday: weekday
        };
      });

      if (hasUpdates) {
        if (isCloudActive) {
          const changedItems = updatedItems.filter((item, index) =>
            item.rawDate !== items[index].rawDate || item.status !== items[index].status
          );
          await Promise.all(changedItems.map(item =>
            supabase.from('ensaios').update({
              rawDate: item.rawDate,
              date: item.date,
              dayOfWeek: item.dayOfWeek,
              status: item.status,
              originalDateStr: item.originalDateStr,
              suspendedReason: item.suspendedReason,
              patternNth: item.patternNth,
              patternWeekday: item.patternWeekday,
              referenceMonth: item.referenceMonth,
              overrideDate: item.overrideDate
            }).eq('id', item.id)
          ));
        } else {
          localStorage.setItem('agenda_ensaios_data', JSON.stringify(updatedItems));
        }
      }

      return updatedItems;
    };

    const App = () => {
      const [daysFilter, setDaysFilter] = useState(15);
      const [isDaysFilterOpen, setIsDaysFilterOpen] = useState(false);
      const [activeTab, setActiveTab] = useState('ensaios');
      const [rehearsals, setRehearsals] = useState([]);
      const [cities, setCities] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedRehearsal, setSelectedRehearsal] = useState(null);
      const [currentVerse, setCurrentVerse] = useState(BIBLE_VERSES[0]);
      const [browsingCity, setBrowsingCity] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [password, setPassword] = useState('');
      const [isAdding, setIsAdding] = useState(false);
      const [isManagingCities, setIsManagingCities] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const lastBackPress = React.useRef(0);

      const [form, setForm] = useState({
        churchName: '', city: '', time: '',
        recurrence: 'unico', locationUrl: '', status: 'normal',
        originalDateStr: '', suspendedReason: '', patternNth: 1, patternWeekday: 0,
        referenceMonth: new Date().getMonth(), overrideDate: ''
      });

      const [cityForm, setCityForm] = useState({ name: '' });

      const sincronizarLembretesDiarios = async (isManual = true) => {
        try {
          // 1. Permissões
          const permission = await LocalNotifications.checkPermissions();
          if (permission.display !== 'granted') {
            if (isManual) {
              const request = await LocalNotifications.requestPermissions();
              if (request.display !== 'granted') {
                alert("Permissão de notificação negada.");
                return;
              }
            } else {
              // No modo automático, se não tiver permissão, apenas ignoramos silenciosamente
              return;
            }
          }

          // 2. Limpar agendamentos anteriores
          await LocalNotifications.cancel({ notifications: await (await LocalNotifications.getPending()).notifications });

          // 3. Agendar para os próximos 14 dias
          const notifications = [];
          const now = new Date();

          for (let i = 0; i < 14; i++) {
            const targetDay = new Date();
            targetDay.setDate(now.getDate() + i);
            const isoDate = targetDay.toISOString().split('T')[0];

            const dailyEnsaios = rehearsals.filter(r => r.rawDate === isoDate && r.status !== 'suspenso');

            if (dailyEnsaios.length > 0) {
              const names = dailyEnsaios.map(r => r.churchName);
              const scheduleTime = new Date(targetDay.getFullYear(), targetDay.getMonth(), targetDay.getDate(), 9, 0, 0);

              if (scheduleTime > now) {
                notifications.push({
                  title: "Ensaios de Hoje 🎵",
                  body: `Você tem ensaio em: ${names.join(', ')}.`,
                  id: 900 + i,
                  schedule: { at: scheduleTime },
                  sound: 'default'
                });
              }
            }
          }

          if (notifications.length > 0) {
            await LocalNotifications.schedule({ notifications });
            if (isManual) alert(`Sincronizado! Você receberá um resumo às 09:00 nos dias de ensaio (próximas 2 semanas).`);
            else console.log("Notificações sincronizadas automaticamente.");
          } else {
            if (isManual) alert("Nenhum ensaio futuro encontrado para agendar lembretes.");
          }

        } catch (error) {
          console.error("Erro na sincronização:", error);
          if (isManual) alert("Ocorreu um erro ao sincronizar os lembretes.");
        }
      };

      const nextGradeDate = useMemo(() => {
        // Se estamos editando, queremos a grade DAQUELE mês. 
        // Se é novo, queremos a PRÓXIMA grade a partir de hoje.
        const baseDate = editingId && form.rawDate ? new Date(form.rawDate + 'T00:00:00') : new Date();
        if (!editingId) baseDate.setHours(0, 0, 0, 0);

        const monthsToAdd = RECURRENCE_MONTHS[form.recurrence] || 1;
        const start = getNextValidMonth(baseDate.getFullYear(), baseDate.getMonth(), monthsToAdd, form.referenceMonth);
        let d = getDateFromPattern(start.year, start.month, form.patternNth, form.patternWeekday);

        // Se estamos criando novo e a data já passou hoje, pula pra próxima
        if (!editingId && d < baseDate) {
          const next = getNextValidMonth(start.year, start.month + 1, monthsToAdd, form.referenceMonth);
          d = getDateFromPattern(next.year, next.month, form.patternNth, form.patternWeekday);
        }
        return d.toLocaleDateString('pt-BR').substring(0, 5);
      }, [form.recurrence, form.referenceMonth, form.patternNth, form.patternWeekday, form.rawDate, editingId]);

      const handleSelectRehearsal = (rehearsal) => {
        if (rehearsal) {
          const randomIndex = Math.floor(Math.random() * BIBLE_VERSES.length);
          setCurrentVerse(BIBLE_VERSES[randomIndex]);
        }
        setSelectedRehearsal(rehearsal);
      };

      const fetchData = async () => {
        if (!isCloudActive) {
          const savedRehearsals = localStorage.getItem('agenda_ensaios_data');
          const savedCities = localStorage.getItem('agenda_cidades_data');
          let localRehearsals = savedRehearsals ? JSON.parse(savedRehearsals) : [];

          localRehearsals = await checkAndAdvanceRehearsals(localRehearsals);

          setRehearsals(localRehearsals);
          setCities(savedCities ? JSON.parse(savedCities) : INITIAL_CHURCHES);
          setLoading(false);
          return;
        }

        const [rehearsalsResponse, citiesResponse] = await Promise.all([
          supabase.from('ensaios').select('*').order('rawDate', { ascending: true }),
          supabase.from('cidades').select('*').order('name', { ascending: true })
        ]);

        if (rehearsalsResponse.error) console.error("Erro ensaios:", rehearsalsResponse.error);
        else {
          const loaded = rehearsalsResponse.data || [];
          const processed = await checkAndAdvanceRehearsals(loaded);
          setRehearsals(processed);
        }

        if (citiesResponse.error) console.error("Erro cidades:", citiesResponse.error);
        else {
          setCities(citiesResponse.data || []);
          if (citiesResponse.data?.length > 0 && !form.city) {
            setForm(prev => ({ ...prev, city: citiesResponse.data[0].name }));
          }
        }

        setLoading(false);
      };

      useEffect(() => {
        fetchData();

        if (isCloudActive) {
          const subscription = supabase
            .channel('public:ensaios')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'ensaios' }, fetchData)
            .subscribe();

          return () => { supabase.removeChannel(subscription); };
        }
      }, []);

      // Efeito para sincronização automática quando os ensaios terminam de carregar
      useEffect(() => {
        if (!loading && rehearsals.length > 0) {
          sincronizarLembretesDiarios(false);
        }
      }, [loading, rehearsals.length]);

      // --- Configuração Nativa (Capacitor) ---
      const stateRef = React.useRef({ selectedRehearsal, activeTab, browsingCity, isAdding, isManagingCities });

      useEffect(() => {
        stateRef.current = { selectedRehearsal, activeTab, browsingCity, isAdding, isManagingCities };
      }, [selectedRehearsal, activeTab, browsingCity, isAdding, isManagingCities]);

      useEffect(() => {
        // Status Bar
        try {
          StatusBar.setStyle({ style: Style.Dark });
          StatusBar.setBackgroundColor({ color: '#ffffff' });
          StatusBar.setOverlaysWebView({ overlay: false });
        } catch (e) {
          console.warn('StatusBar plugin not available', e);
        }

        // Hardware Back Button
        let backListener;
        try {
          const AppPlugin = CapApp || (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App);

          if (AppPlugin) {
            backListener = AppPlugin.addListener('backButton', () => {
              const { selectedRehearsal, activeTab, browsingCity, isAdding, isManagingCities } = stateRef.current;
              const now = Date.now();

              if (selectedRehearsal) {
                handleSelectRehearsal(null);
              } else if (isAdding) {
                setIsAdding(false);
                setEditingId(null);
              } else if (isManagingCities) {
                setIsManagingCities(false);
              } else if (activeTab === 'igrejas' && browsingCity) {
                setBrowsingCity(null);
              } else if (activeTab !== 'ensaios') {
                setActiveTab('ensaios');
                setBrowsingCity(null);
              } else {
                if (now - lastBackPress.current < 2000) {
                  AppPlugin.exitApp();
                } else {
                  lastBackPress.current = now;
                  alert('Pressione novamente para sair');
                }
              }
            });
          }
        } catch (e) {
          console.warn('App plugin not available', e);
        }

        return () => {
          if (backListener) {
            backListener.then ? backListener.then(h => h.remove()) : backListener.remove();
          }
        };
      }, []);

      const handleSave = async (e) => {
        e.preventDefault();

        // Validações
        if (!form.churchName.trim()) {
          alert("Por favor, preencha a Casa de Oração.");
          return;
        }
        if (!form.city) {
          alert("Por favor, selecione uma Cidade.");
          return;
        }
        if (!form.time) {
          alert("Por favor, informe o Horário.");
          return;
        }

        // Calcular a próxima data baseada no padrão escolhido
        const now = new Date();
        now.setHours(0, 0, 0, 0);

        const monthsToAdd = RECURRENCE_MONTHS[form.recurrence] || 1;
        const start = getNextValidMonth(now.getFullYear(), now.getMonth(), monthsToAdd, form.referenceMonth);

        let nextDate;

        if (form.overrideDate) {
          nextDate = new Date(form.overrideDate + 'T00:00:00');
        } else {
          // Lógica para posições fixas (1º, 2º, 3º, 4º, 5º)
          nextDate = getDateFromPattern(
            start.year,
            start.month,
            form.patternNth,
            form.patternWeekday
          );

          // Se a data calculada já passou, pegar o próximo período de recorrência
          if (nextDate < now) {
            const next = getNextValidMonth(start.year, start.month + 1, monthsToAdd, form.referenceMonth);
            nextDate = getDateFromPattern(
              next.year,
              next.month,
              form.patternNth,
              form.patternWeekday
            );
          }
        }

        const isoDate = toLocalISOString(nextDate);

        const data = {
          dayOfWeek: DAYS[nextDate.getDay()],
          date: isoDate.split('-').reverse().join('/').substring(0, 5),
          time: form.time,
          churchName: form.churchName.toUpperCase().trim(),
          city: form.city,
          recurrence: form.recurrence,
          locationUrl: form.locationUrl,
          rawDate: isoDate,
          status: form.status,
          originalDateStr: form.status === 'remarcado' ? form.originalDateStr : '',
          suspendedReason: form.status === 'suspenso' ? form.suspendedReason : '',
          patternNth: form.patternNth,
          patternWeekday: form.patternWeekday,
          referenceMonth: form.referenceMonth,
          overrideDate: form.overrideDate || null
        };

        if (isCloudActive) {
          try {
            let res;
            if (editingId) {
              res = await supabase.from('ensaios').update(data).eq('id', editingId);
            } else {
              res = await supabase.from('ensaios').insert([data]);
            }

            if (res.error) {
              console.error("Erro Supabase:", res.error);
              alert("Erro ao salvar no banco de dados: " + res.error.message);
              return;
            }

            fetchData();
          } catch (err) {
            console.error("Erro inesperado:", err);
            alert("Ocorreu um erro inesperado ao salvar: " + err.message);
            return;
          }
        } else {
          const updated = editingId
            ? rehearsals.map(r => r.id === editingId ? { ...data, id: editingId } : r)
            : [{ ...data, id: Date.now().toString() }, ...rehearsals];
          setRehearsals(updated);
          localStorage.setItem('agenda_ensaios_data', JSON.stringify(updated));
        }
        setIsAdding(false); setEditingId(null);
      };

      const handleAdvanceRehearsal = async (r) => {
        const monthsToAdd = RECURRENCE_MONTHS[r.recurrence] || 1;
        const currentDate = new Date(r.rawDate + 'T00:00:00');

        const next = getNextValidMonth(currentDate.getFullYear(), currentDate.getMonth() + 1, monthsToAdd, r.referenceMonth);
        const nextDate = getDateFromPattern(next.year, next.month, r.patternNth, r.patternWeekday);
        const isoDate = toLocalISOString(nextDate);

        const nextData = {
          ...r,
          originalDateStr: '',
          suspendedReason: '',
          overrideDate: null,
          rawDate: isoDate,
          date: isoDate.split('-').reverse().join('/').substring(0, 5),
          dayOfWeek: DAYS[nextDate.getDay()]
        };
        delete nextData.id;

        if (isCloudActive) {
          await supabase.from('ensaios').update(nextData).eq('id', r.id);
        } else {
          const updated = rehearsals.map(item => item.id === r.id ? { ...nextData, id: r.id } : item);
          setRehearsals(updated);
          localStorage.setItem('agenda_ensaios_data', JSON.stringify(updated));
        }
        alert("Ensaio avançado! O status voltou ao normal conforme o dia padrão.");
      };

      const upcomingRehearsals = useMemo(() => {
        const now = new Date(); now.setHours(0, 0, 0, 0);
        const limit = new Date(); limit.setDate(now.getDate() + daysFilter);
        return rehearsals.filter(r => {
          const rd = new Date(r.rawDate + 'T00:00:00');
          return rd >= now && rd <= limit;
        });
      }, [rehearsals, daysFilter]);

      const cityRehearsals = useMemo(() => {
        if (!browsingCity) return [];
        const now = new Date(); now.setHours(0, 0, 0, 0);
        return rehearsals.filter(r => r.city === browsingCity && new Date(r.rawDate + 'T00:00:00') >= now);
      }, [rehearsals, browsingCity]);

                                  <option value="quadrimestral">Quadrimestral (4 em 4 meses)</option>
                                </select>
                              </div>

                              {['bimestral', 'trimestral', 'quadrimestral'].includes(form.recurrence) && (
                                <div className="space-y-1 animate-card">
                                  <label className="text-[10px] font-bold text-gray-400 uppercase ml-2">Mês de Referência (Início do Ciclo)</label>
                                  <select
                                    className="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none"
                                    value={form.referenceMonth}
                                    onChange={e => setForm({ ...form, referenceMonth: parseInt(e.target.value) })}
                                  >
                                    {MONTHS.map((m, idx) => (
                                      <option key={idx} value={idx}>{m}</option>
                                    ))}
                                  </select>
                                </div>
                              )}

                              <div className="space-y-2 pt-2">
                                <label className="text-[10px] font-bold text-gray-400 uppercase ml-2">Status do Ensaio</label>
                                <div className="flex gap-2">
                                  <button
                                    type="button"
                                    onClick={() => setForm({ ...form, status: 'normal' })}
                                    className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl font-bold text-[10px] border transition-all ${form.status === 'normal' ? 'bg-green-50 border-green-200 text-green-700 shadow-sm' : 'bg-gray-50 border-gray-200 text-gray-400 opacity-60'}`}
                                  >
                                    <CheckCircle2 size={14} /> NORMAL
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => setForm({ ...form, status: 'remarcado' })}
                                    className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl font-bold text-[10px] border transition-all ${form.status === 'remarcado' ? 'bg-orange-50 border-orange-200 text-orange-700 shadow-sm' : 'bg-gray-50 border-gray-200 text-gray-400 opacity-60'}`}
                                  >
                                    <AlertCircle size={14} /> REMARCADO
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => setForm({ ...form, status: 'suspenso' })}
                                    className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl font-bold text-[10px] border transition-all ${form.status === 'suspenso' ? 'bg-red-50 border-red-200 text-red-700 shadow-sm' : 'bg-gray-50 border-gray-200 text-gray-400 opacity-60'}`}
                                  >
                                    <XCircle size={14} /> SUSPENSO
                                  </button>
                                </div>

                                {form.status === 'suspenso' && (
                                  <div className="p-4 bg-red-50 border border-red-100 rounded-2xl mt-2 animate-card">
                                    <div className="flex items-center gap-2 mb-2 text-red-700">
                                      <XCircle size={16} />
                                      <label className="text-[10px] font-bold uppercase">Motivo da Suspensão (Opcional)</label>
                                    </div>
                                    <input
                                      placeholder="Ex: Reforma na igreja, festa local..."
                                      className="w-full p-3 bg-white border border-red-200 rounded-xl outline-none text-red-700 placeholder:text-red-300 font-bold text-sm shadow-inner"
                                      value={form.suspendedReason}
                                      onChange={e => setForm({ ...form, suspendedReason: e.target.value })}
                                    />
                                  </div>
                                )}

                                {form.status === 'remarcado' && (
                                  <div className="p-4 bg-orange-50 border border-orange-100 rounded-2xl mt-2 animate-card">
                                    <div className="flex items-center justify-between mb-3 border-b border-orange-100 pb-2">
                                      <div className="flex items-center gap-2 text-orange-700">
                                        <CalendarClock size={16} />
                                        <label className="text-[10px] font-bold uppercase tracking-wider">Configuração da Remarcação</label>
                                      </div>
                                      <div className="bg-orange-600 text-white px-3 py-1 rounded-full text-[10px] font-black shadow-sm">
                                        GRADE: {nextGradeDate}
                                      </div>
                                    </div>

                                    <div className="flex items-center gap-2 mb-2 text-orange-700">
                                      <label className="text-[10px] font-bold uppercase">Motivo da Alteração (Opcional)</label>
                                    </div>
                                    <input
                                      placeholder="Ex: Antecipado devido ao feriado..."
                                      className="w-full p-3 bg-white border border-orange-200 rounded-xl outline-none text-orange-700 placeholder:text-orange-300 font-bold text-sm shadow-inner"
                                      value={form.originalDateStr}
                                      onChange={e => setForm({ ...form, originalDateStr: e.target.value })}
                                    />
                                    <p className="text-[9px] text-orange-600 mt-2 italic font-medium">Os irmãos verão que o ensaio mudou por este motivo.</p>
                                  </div>
                                )}
                              </div>

                              {form.status === 'remarcado' && (
                                <div className="space-y-1 animate-card">
                                  <label className="text-[10px] font-bold text-orange-400 uppercase ml-2 flex items-center gap-1">
                                    <CalendarDays size={12} className="text-orange-500" /> Nova Data do Ensaio
                                  </label>
                                  <input
                                    type="date"
                                    className="w-full p-4 bg-orange-50/30 border border-orange-100 rounded-2xl outline-none focus:border-orange-300 font-bold text-orange-700"
                                    value={form.overrideDate || ''}
                                    onChange={e => setForm({ ...form, overrideDate: e.target.value })}
                                  />
                                  <p className="text-[9px] text-orange-400 ml-2 italic">Escolha o novo dia em que o ensaio será realizado.</p>
                                </div>
                              )}

                              <div className="space-y-1">
                                <label className="text-[10px] font-bold text-blue-600 uppercase ml-2 flex items-center gap-1"><MapPin size={10} /> Localização (Endereço ou Link Maps)</label>
                                <input placeholder="Digite o endereço ou cole o link do Google Maps" className="w-full p-4 bg-blue-50/50 border border-blue-100 rounded-2xl outline-none text-blue-700 text-sm" value={form.locationUrl} onChange={e => setForm({ ...form, locationUrl: e.target.value })} />
                              </div>

                              <div className="flex gap-3 pt-4"><button type="button" onClick={() => setIsAdding(false)} className="flex-1 bg-gray-100 py-4 rounded-2xl font-bold text-gray-500">CANCELAR</button><button type="submit" className="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg">SALVAR</button></div>
                            </form>
                          ) : (
                              <div className="space-y-4">
                                <button onClick={() => { setEditingId(null); setIsAdding(true); setForm({ churchName: '', city: cities[0]?.name || '', time: '', recurrence: 'unico', status: 'normal', originalDateStr: '', suspendedReason: '', locationUrl: '', patternNth: 1, patternWeekday: 0, referenceMonth: new Date().getMonth(), overrideDate: '' }); }} className="w-full bg-blue-600 text-white font-bold p-5 rounded-2xl flex items-center justify-center gap-2 mb-4 shadow-xl"><Plus size={24} /> NOVO ENSAIO</button>
                                
                                <div className="relative mb-6">
                                  <input 
                                    type="text" 
                                    placeholder="Buscar por igreja ou cidade..." 
                                    className="w-full p-4 pl-12 bg-white border border-gray-200 rounded-2xl outline-none focus:border-blue-300 font-medium shadow-sm transition-all"
                                    value={searchTerm}
                                    onChange={e => setSearchTerm(e.target.value)}
                                  />
                                  <Lucide.Search size={20} className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" />
                                  {searchTerm && (
                                    <button 
                                      onClick={() => setSearchTerm('')}
                                      className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors"
                                    >
                                      <Lucide.X size={18} />
                                    </button>
                                  )}
                                </div>

                                {rehearsals.filter(r => 
                                  !searchTerm || 
                                  r.churchName.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                  r.city.toLowerCase().includes(searchTerm.toLowerCase())
                                ).map(r => (
                                  <div key={r.id} className={`bg-white p-5 rounded-3xl flex items-center justify-between border border-gray-200 shadow-sm transition-all hover:shadow-md ${r.status === 'suspenso' ? 'opacity-75 grayscale-[0.5]' : ''}`}>
                                  <div className="pr-4">
                                    <div className="flex items-center gap-1.5">
                                      <p className="text-lg font-black text-gray-800 leading-tight whitespace-normal">{r.churchName}</p>
                                      {r.status === 'remarcado' && <AlertCircle size={14} className="text-orange-500 shrink-0" />}
                                      {r.status === 'suspenso' && <XCircle size={14} className="text-red-500 shrink-0" />}
                                    </div>
                                    <p className="text-[10px] text-gray-400 font-bold uppercase mt-0.5">{r.date} • {r.city}</p>
                                  </div>
                                  <div className="flex gap-1 shrink-0">
                                    <button title="Avançar Mês (Reset Status)" onClick={() => handleAdvanceRehearsal(r)} className="text-green-600 p-2 hover:bg-green-50 rounded-lg"><RefreshCw size={18} /></button>
                                    <button onClick={() => { setEditingId(r.id); setIsAdding(true); setForm({ ...r, churchName: r.churchName }); }} className="text-blue-600 p-2 hover:bg-blue-50 rounded-lg"><Pencil size={18} /></button>
                                    <button onClick={async () => { if (confirm('Excluir ensaio?')) { if (isCloudActive) { await supabase.from('ensaios').delete().eq('id', r.id); } else { setRehearsals(rehearsals.filter(x => x.id !== r.id)); } } }} className="text-red-500 p-2 hover:bg-red-50 rounded-lg"><Trash2 size={18} /></button>
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </>
                      ) : (
                        <div className="space-y-6">
                          <form onSubmit={handleCitySave} className="bg-white p-6 rounded-3xl space-y-4 border border-gray-200 shadow-xl">
                            <h3 className="text-center font-bold text-blue-600 uppercase text-xs">Nova Cidade</h3>
                            <div className="space-y-1">
                              <label className="text-[10px] font-bold text-gray-400 uppercase ml-2">Nome da Cidade <span className="text-red-500">*</span></label>
                              <input
                                placeholder="Ex: Alagoinhas"
                                className="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:border-blue-300 font-bold"
                                value={cityForm.name}
                                onChange={e => setCityForm({ name: e.target.value })}
                              />
                            </div>
                            <button type="submit" className="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-all">
                              <Plus size={20} /> ADICIONAR CIDADE
                            </button>
                          </form>

                          <div className="space-y-3">
                            <h3 className="text-gray-400 font-bold uppercase text-[10px] ml-2 tracking-widest">Cidades Cadastradas</h3>
                            {cities.map(c => (
                              <div key={c.id} className="bg-white p-4 rounded-2xl flex items-center justify-between border border-gray-100 shadow-sm">
                                <p className="font-bold text-gray-700">{c.name}</p>
                                <button
                                  onClick={() => handleCityDelete(c.id)}
                                  className="text-red-400 p-2 hover:bg-red-50 rounded-xl transition-colors"
                                >
                                  <Trash2 size={18} />
                                </button>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                    </div>
                  )}
                </div>
              )}
              <div className="mt-12 text-center pb-8 border-t border-gray-100 pt-8">
                <p className="text-[10px] text-gray-500 font-black uppercase tracking-[0.2em] mb-2">Departamento Musical Alagoinhas - BA</p>
                <a href="/privacy.html" target="_blank" className="text-[10px] text-gray-400 font-bold uppercase hover:text-blue-600 transition-colors underline decoration-dotted">Política de Privacidade</a>
                <p className="text-[8px] text-gray-300 mt-2 italic">Agenda de Ensaio © 2026</p>
              </div>
            </>
          )}
        </main>

        {!selectedRehearsal && (
          <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-lg border-t border-gray-200 flex justify-around items-center py-3 safe-area-bottom z-50">
            <button onClick={() => { setActiveTab('ensaios'); setBrowsingCity(null); }} className={`flex flex-col items-center gap-1.5 py-1 px-5 rounded-2xl ${activeTab === 'ensaios' ? 'text-blue-600 bg-blue-50 border border-blue-100' : 'text-gray-400'}`}><Music size={22} /><span className="text-[10px] font-bold uppercase">Ensaios</span></button>
            <button onClick={() => setActiveTab('igrejas')} className={`flex flex-col items-center gap-1.5 py-1 px-5 rounded-2xl ${activeTab === 'igrejas' ? 'text-blue-600 bg-blue-50 border border-blue-100' : 'text-gray-400'}`}><MapPin size={22} /><span className="text-[10px] font-bold uppercase">Cidades</span></button>
            <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center gap-1.5 py-1 px-5 rounded-2xl ${activeTab === 'admin' ? 'text-blue-600 bg-blue-50 border border-blue-100' : 'text-gray-400'}`}><Settings size={22} /><span className="text-[10px] font-bold uppercase">Painel</span></button>
          </nav>
        )}
      </div>
    );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Registrar o Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registrado!', reg))
          .catch(err => console.log('Falha ao registrar Service Worker:', err));
      });
    }
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
